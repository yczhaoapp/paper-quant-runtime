name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    name: Host ${{ matrix.os }} Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.18"
      - name: Install locked dependencies
        run: uv sync --locked --extra dev
      - name: Unit and integration tests
        run: uv run --no-sync python -m pytest -q -p no:cacheprovider
      - name: Lint
        run: uv run --no-sync ruff check .
      - name: Type check
        run: uv run --no-sync mypy src/paperquant
      - name: Verify all eighteen strategy packages
        run: uv run --no-sync python scripts/acceptance.py --output runs/host-acceptance
      - name: Preserve host acceptance reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: host-acceptance-${{ matrix.os }}-py${{ matrix.python }}-${{ github.sha }}
          path: runs/host-acceptance
          if-no-files-found: warn

  strict:
    name: Strict container and receipts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.18"
      - name: Install locked dependencies
        run: uv sync --locked --extra dev
      - name: Build and verify strict worker
        run: uv run --no-sync python scripts/verify_strict.py --require-clean --output runs/strict-verification
      - name: Preserve attempt receipts and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: strict-verification-${{ github.sha }}
          path: runs/strict-verification
          if-no-files-found: error

  paper-depth:
    name: Original-paper depth and independent intake
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.18"
      - name: Install locked dependencies
        run: uv sync --locked --extra dev
      - name: Fetch hash-pinned papers and verify 18 plus independent case
        run: uv run --no-sync python -m scripts.accept_paper_depth --fetch --output runs/paper-depth
      - name: Preserve paper-depth receipts without redistributing source PDFs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: paper-depth-${{ github.sha }}
          path: |
            runs/paper-depth
            !runs/paper-depth/attempts/*/independent/build/paper.pdf
          if-no-files-found: error
