[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "paper-quant-runtime"
version = "0.1.0"
description = "A contract-first runtime for research strategies and reproducible paper trading."
requires-python = ">=3.12,<3.14"
dependencies = [
    "pydantic>=2.8,<3",
    "pypdf==6.19.0",
    "tzdata==2026.4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1", "mypy>=1.11,<2"]

[project.scripts]
paperquant = "paperquant.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/paperquant"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["paperquant"]
